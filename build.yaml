# JPRM-compatible plugin metadata (https://github.com/oddstr13/jellyfin-plugin-repository-manager).
# The GitHub release workflow reads guid/name/overview/description/owner/category/targetAbi from here.
name: "Media Vote"
guid: "1ffa7b73-334b-4a42-b6c8-0f7b48457bb8"
version: "1.1.0.0"
targetAbi: "10.11.10.0"
framework: "net9.0"
overview: "Let your users vote on which movies and shows to remove."
description: >
  An administrator calls a vote among selected Jellyfin users. Users vote from a banner at the top of
  their home page, a Vote tab (Custom Tabs), a sidebar page (Plugin Pages) or a standalone page. At the
  deadline the top N titles are either reported to the admin (default) or deleted with their files by
  Sonarr (series) or Radarr (movies). Media Vote itself never deletes or changes a media file.
category: "General"
owner: "alexgirollet-blip"
artifacts:
  - "Jellyfin.Plugin.MediaVote.dll"
changelog: >
  1.1.0.0. A much easier vote builder. One shared media browser for the admin's hand-pick step and for
  voters (grid/list; size, drive and its fullness, who watched it last and when, plays, viewers, date
  added, removable by Sonarr/Radarr; filters, sorts and paging on the server; select all in a filter and a
  tray with per-drive totals). Deadline picker with quick choices, a flexible "in N days at HH:MM" row and a
  plain-words result worked out by the server (correct across clock changes). Drive detection with usage
  bars, names and warning levels; Storage and History tabs; free-space target; approval step before
  Sonarr/Radarr delete anything (on by default, optional auto-approve); presets; tie-break rules;
  templates and recurring drafts; results with sizes and a "Request it again" link; webhook extras. All
  1.0.2.0 safety rules are unchanged. Requires Jellyfin 10.11.10.
