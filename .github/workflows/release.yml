name: Release

# Push a version tag (e.g. `git tag -a v1.0.2.0 -m "Media Vote 1.0.2.0" && git push origin v1.0.2.0`).
# This builds and tests the plugin, zips the DLL, creates a GitHub Release with the zip,
# and regenerates manifest.json on the default branch so the plugin repository URL serves it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Work out version from tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          v="${tag#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3.4 (got $tag)"; exit 1
          fi
          if [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then v="$v.0"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Annotated tag: use its message. Lightweight tag (git shows the commit message instead, e.g. a
          # merge commit): use the build.yaml changelog.
          notes=""
          if [ "$(git cat-file -t "$tag")" = "tag" ]; then
            notes="$(git tag -l --format='%(contents)' "$tag" | sed '/^-----BEGIN PGP/,$d')"
          fi
          if [ -z "$notes" ]; then
            notes="$(python3 -c "import re;t=open('build.yaml',encoding='utf-8').read();m=re.search(r'^changelog: >\n((?:  .*\n?)+)',t,re.M);print(' '.join(l.strip() for l in m.group(1).splitlines()) if m else '')")"
          fi
          if [ -z "$notes" ]; then notes="Media Vote $v"; fi
          {
            echo "notes<<MEDIAVOTE_EOF"
            echo "$notes"
            echo "MEDIAVOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Jellyfin version consistency (csproj = build.yaml targetAbi)
        run: python3 .github/scripts/check_versions.py

      - name: Test
        run: dotnet test -c Release

      - name: Binary compatibility with the target Jellyfin version
        run: |
          v=$(python3 -c "import re;print(re.search(r'targetAbi:\s*\"([0-9]+\.[0-9]+\.[0-9]+)', open('build.yaml').read()).group(1))")
          dotnet build src/Jellyfin.Plugin.MediaVote -c Release
          dotnet build tools/ApiCompat -c Release -p:JellyfinVersion=$v
          dotnet tools/ApiCompat/bin/Release/net9.0/ApiCompat.dll src/Jellyfin.Plugin.MediaVote/bin/Release/net9.0/Jellyfin.Plugin.MediaVote.dll

      - name: Build plugin
        run: |
          v='${{ steps.ver.outputs.version }}'
          dotnet publish src/Jellyfin.Plugin.MediaVote/Jellyfin.Plugin.MediaVote.csproj -c Release -o publish \
            -p:Version=$v -p:AssemblyVersion=$v -p:FileVersion=$v

      - name: Package zip
        id: pkg
        run: |
          v='${{ steps.ver.outputs.version }}'
          zip="media-vote_${v}.zip"
          mkdir -p artifacts
          (cd publish && zip -j "../artifacts/${zip}" Jellyfin.Plugin.MediaVote.dll)
          unzip -l "artifacts/${zip}"
          echo "zip=artifacts/${zip}" >> "$GITHUB_OUTPUT"
          echo "name=${zip}" >> "$GITHUB_OUTPUT"
          md5sum "artifacts/${zip}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          # Notes come through an environment variable: quotes in them must never become shell syntax.
          printf '%s\n' "$NOTES" > notes.txt
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # Release already created (e.g. in the GitHub web UI): just attach/replace the zip.
            gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.zip }}" \
              --title "Media Vote ${{ steps.ver.outputs.version }}" --notes-file notes.txt
          fi

      - name: Check out default branch for the manifest
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: manifest-branch

      - name: Update manifest.json
        env:
          NOTES: ${{ steps.ver.outputs.notes }}
        run: |
          v='${{ steps.ver.outputs.version }}'
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.pkg.outputs.name }}"
          printf '%s\n' "$NOTES" > notes.txt
          python3 .github/scripts/update_manifest.py \
            --manifest manifest-branch/manifest.json \
            --build-yaml build.yaml \
            --version "$v" \
            --source-url "$url" \
            --zip "${{ steps.pkg.outputs.zip }}" \
            --changelog "$(cat notes.txt)"
          cd manifest-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest.json for ${GITHUB_REF_NAME}"
          git push
